<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>YouLiar</title>
  <meta name="theme-color" content="#0e0b16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" aria-label="Retour" hidden>←</button>
    <h1 class="brand">You<span>Liar</span></h1>
    <span id="session-badge" class="badge" hidden></span>
    <button id="mute" class="icon-btn" aria-label="Couper le son">🔊</button>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="toast" role="status" hidden></div>
  <div id="edge-glow" aria-hidden="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
