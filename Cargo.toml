[workspace]
resolver = "2"
members = ["crates/youliar-core", "src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"

[profile.dev.package."*"]
# L'analyse audio (YIN, FFT) est lente en debug : on optimise les dépendances
# et le cœur même en mode développement.
opt-level = 2

[profile.dev.package.youliar-core]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
