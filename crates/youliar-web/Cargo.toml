[package]
name = "youliar-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Moteur YouLiar compilé en WebAssembly pour les joueurs qui rejoignent depuis un navigateur"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
youliar-core = { path = "../youliar-core" }
wasm-bindgen = "=0.2.130"
serde = "1"
serde_json = "1"
rand = "0.8"
# Aléa du navigateur (crypto.getRandomValues) pour SPAKE2 et les identifiants.
getrandom = { version = "0.2", features = ["js"] }
